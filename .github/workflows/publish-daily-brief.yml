name: Publish Daily Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: guy-daily-brief

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: guy-daily-brief/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate today's brief
        run: npm run publish

      - name: Commit updated brief content
        working-directory: .
        run: |
          if git diff --quiet -- guy-daily-brief/content/briefs; then
            echo "No briefing changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guy-daily-brief/content/briefs
          git commit -m "Publish daily brief $(date -u +%F)"
          git push origin HEAD:main
