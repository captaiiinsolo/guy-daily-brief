name: Publish Daily Brief

on:
  workflow_dispatch:
    inputs:
      section:
        description: "Refresh only one section instead of the full brief"
        required: false
        type: choice
        options:
          - all
          - us
          - world
          - tech
        default: all
  schedule:
    - cron: "0 13 * 3-10 *"
    - cron: "0 14 * 1,2,11,12 *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: guy-daily-brief

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: guy-daily-brief/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate today's brief or one section
        run: |
          SECTION="${{ github.event.inputs.section || 'all' }}"
          if [ "$SECTION" = "all" ]; then
            npm run publish
          else
            npm run refresh-section -- "$SECTION"
            npm run validate
          fi

      - name: Commit updated brief content
        working-directory: .
        run: |
          if git diff --quiet -- guy-daily-brief/content/briefs; then
            echo "No briefing changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guy-daily-brief/content/briefs
          SECTION="${{ github.event.inputs.section || 'all' }}"
          if [ "$SECTION" = "all" ]; then
            git commit -m "Publish daily brief $(date -u +%F)"
          else
            git commit -m "Refresh ${SECTION} section $(date -u +%F)"
          fi
          git push origin HEAD:main
